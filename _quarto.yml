project:
  type: book
  output-dir: _book
  resources:
  - "/.nojekyll"
  pre-render:
    - libs/pre-render.R
  post-render:
    - libs/post-render.R

execute:
  echo: false
  warning: false

book:
  title: "Marine Sensitivity"
  subtitle: "Project Documentation"
  author:
  - name: "Benjamin D. Best"
    orcid: 0000-0002-2686-0784
    email: ben@oceanmetrics.io
    affiliations:
      - name: Ocean Metrics LLC
  - name: "Timothy P. White"
    email: timothy.white@boem.gov
    affiliations:
      - name: BOEM’s Office of Environmental Programs
        city: Sterling
        state: VA
  date: today
  date-format: "YYYY-MM-DD"
  repo-url: https://github.com/MarineSensitivity/docs/
  repo-actions: [edit]
  favicon: images/favicon.ico
  cover-image: images/mst-hero.png
  downloads: [pdf, docx]
  sharing: [twitter, facebook]
  # analytics live in _analytics.html (include-in-header under format.html), not
  # the `google-analytics:` key — the key cannot set `content_group` (how the one
  # shared measurement ID separates products) and cannot track the pdf/docx
  # download buttons above. NOTE: the ID previously stubbed here (G-V3HZN14Z8G)
  # was NOT the project property; docs now share the homepage's G-9HW6L751XG.
  search: true
  page-navigation: true
  page-footer:
    left: |
      © <a href="https://bbest.github.io/cv/"  target="_blank">Ben Best</a>,
      <a href="https://www.boem.gov/environment/environmental-studies/environmental-studies-information"  target="_blank">BOEM-ESP</a>
    right: |
      Built with <a href="https://quarto.org/" target="_blank">Quarto</a>
  chapters:
    - index.qmd
    - intro.qmd
    - part: Releases
      chapters:
        - releases.qmd
        - releases/v1.qmd
    - part: Science
      chapters:
        - science.qmd
        - data-sources.qmd
        - taxonomy.qmd
        - extinction-risk.qmd
        - model-merging.qmd
        - scoring.qmd
        - scoring-walkthrough.qmd
        - stressors.qmd
    - part: Software
      chapters:
        - software.qmd
        - server.qmd
        - db.qmd
        - workflows.qmd
        - apis.qmd
        - libraries.qmd
        - apps.qmd
        - apps-guide.qmd
        - docs.qmd
    - summary.qmd
    - references.qmd
  appendices:
    - glossary.qmd
    - part: Applications (Current)
      chapters:
        - apps/scores.qmd
        - apps/species.qmd
    - part: Applications (Legacy)
      chapters:
        - apps/aoi.qmd
        - apps/bird_hotspots.qmd
        - apps/map.qmd
        - apps/scores_0.qmd
        - apps/sdm.qmd
        - apps/sdm-cog.qmd
        - apps/vmap.qmd

bibliography: references.bib

glossary:  # https://debruine.github.io/quarto-glossary/
  path: glossary.yml
  popup: click
  show: true

format:
  html:
    mermaid-format: png
    theme: cosmo
    echo: false
    include-in-header:
      - _analytics.html
      # core links (apps + GitHub) on EVERY page, not only the Preface (docs#6),
      # mounted into the same sidebar host as the version switcher below it
      - _nav-links.html
      - _version-switcher.html
      - _hero-style.html
  docx:
    toc: true
    echo: false
    number-sections: true
    highlight-style: github
    keep-md: true  # see libs/cleanup.R
  pdf:
    documentclass: scrreprt

lightbox: true
