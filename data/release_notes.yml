# Per-release summary bullets, rendered at the top of each version's landing page
# and collected on the Releases page.
#
# EDITORIAL, and deliberately so. What changed and why it matters cannot be
# introspected from a database — the same reasoning as `versions.csv` holding
# status/date/title. This file is the reviewable-in-a-diff source for it.
#
# The COUNTS beside these bullets are NOT written here: `doc_version_delta()`
# computes datasets added/removed, the valid-species change, grid and model-id
# changes from the releases themselves, so a number in the callout cannot drift
# from the data it describes. Write prose here; let the code state the figures.
#
# Four standardized headings, in this order:
#   datasets   - inputs added/changed, AND the ROLE they play (value, mask,
#                spatially-varying extinction risk)
#   methods    - the scientific rules: merge, extinction-risk scoring, floors
#   zones      - the spatial unit(s) this release actually REPORTS scores on.
#                Not the same as the zones present in its `zone` table: v3-v7 carry
#                36 Planning Areas with a couple of non-composite metrics but score
#                none of them. `doc_scored_units()` prints the measured answer
#                beside this prose.
#   scope      - what counts and where: validity definition, spatial units,
#                study area, which taxa are eligible. Separated from `methods`
#                because these are the changes that move the headline count
#                WITHOUT any data changing, and conflating the two is how
#                9,424 -> 16,153 gets misread as growth.
#   technology - formats, serving, identifiers, applications
#
# Omit a heading for a release that did not change it.

v1:
  basis: true
  datasets: >
    **AquaMaps** global environmental-envelope models supply the distribution of nearly every
    species, with **BirdLife** expert ranges for birds. NMFS/FWS critical habitat and FWS ranges
    are present only as a small pilot. Continuous suitability is used as published; expert range
    polygons take a 50% presence value by convention, since an extent-of-occurrence boundary
    asserts presence *somewhere* within it rather than throughout.
  methods: >
    A cell's score is the sum, over the species present, of presence × extinction-risk weight,
    computed separately per species category. Weights are the IUCN **equal-steps** scale used by
    the Red List Index and the STAR metric, rescaled so Least Concern keeps a non-zero weight —
    so overall biological richness stays part of the signal rather than the score being driven
    entirely by the few threatened species. Cell scores are then rescaled **within each BOEM
    Ecoregion** and aggregated by area-weighted mean.
  scope: >
    Marine relevance is decided *spatially* — any model whose distribution reaches the study area
    is included — with no independent test of whether the species is marine. Models are merged only for the handful of taxa that have more than one
    source; every other species is scored directly from its single source model.
  technology: >
    A 0.05° geographic (WGS84) grid, chosen because every input arrives on a latitude/longitude
    grid: analysing in geographic coordinates resamples each input once rather than twice. Area
    distortion is corrected arithmetically rather than by projection.

  zones: >
    Scores are reported on the **36 OCS Planning Areas** and the **12 BOEM Ecoregions**. v1
    predates the Program Areas entirely — its database contains none, which is why a Program
    Area view of v1 is empty rather than merely uninteresting.
v2:
  datasets: >
    **IUCN Red List range maps** added, and used as the global **mask** — constraining AquaMaps
    predictions to the expert-assessed range rather than contributing a value of their own.
  methods: >
    A model-merging pipeline is introduced, producing one merged surface per taxon where a taxon
    has more than one source.
  scope: >
    The **BOEM Program Areas** of the 2026 program cycle are introduced. They do not yet *replace*
    the Planning Areas — this release scores both, and the changeover completes at v3.
  technology: >
    Individual model layers are published, and distributions are stored as cloud-optimized
    GeoTIFFs.

  zones: >
    The **transitional** release: scores are reported on **both** the 36 Planning Areas and the
    new 20 Program Areas, so the two can be compared directly on the same underlying data. This
    is the only release that scores both.
v3:
  datasets: >
    **NMFS core areas** added — designated regions of concentrated use, a targeted high-confidence
    habitat indicator rather than a broad-coverage model.
  methods: >
    Extinction risk is reworked into a single **governing `er_score`** per taxon, taken as the most
    protective across its datasets with a US national listing overriding the international IUCN
    category, plus statutory floors for the **MMPA** (marine mammals) and **MBTA** (migratory
    birds). Merging now runs for **every** taxon, masked to the IUCN range where one exists.
  scope: >
    Taxonomy is tightened: every source name resolves to a canonical WoRMS or BirdLife identity,
    and non-marine and extinct taxa are dropped. Sea turtles become their own category, and
    non-turtle reptiles stop being scored. This roughly halves the valid-species count — a change
    in **definition**, not a loss of data.

  zones: >
    Scores are reported on the **20 Program Areas** only. The Planning Area geometry is still
    carried in the database, and a couple of non-composite metrics with it, but no composite
    score is computed for it — from here on, Planning Areas are history rather than a reporting
    unit.
v4:
  datasets: >
    **SWOT sea turtle ranges** and **NOAA Distinct Population Segment** polygons added, replacing
    the IUCN range as the global mask for all six sea turtle species. Their role is unusual: the
    DPS polygons carry **ESA listing status spatially** (Endangered vs Threatened by region),
    rather than as one scalar per species — the first input to vary extinction risk *within* a
    species' range.
  scope: >
    Turtle distributions become substantially more restrictive, since the IUCN and AquaMaps ranges
    both extended well beyond where the species actually occur.

v4b:
  methods: >
    The **multiplicative turtle merge**: for sea turtles the DPS extinction-risk surface is
    multiplied into the suitability surface during merging, with critical habitat overriding by
    maximum. Risk therefore varies spatially within a species. These taxa pass `er_score = 100`
    through at scoring so the risk already embedded in their values is not counted twice. From
    here the toolkit has **two** merge strategies rather than one.

v5:
  methods: >
    The **MMPA floor is corrected** for FWS-managed marine mammals — walrus, polar bear, sea otter,
    manatee and dugong — which had been missed because the protection flag was derived from the
    NMFS Species Directory alone.

v6:
  datasets: >
    Three missing marine-mammal IUCN ranges ingested from a more complete download.
  scope: >
    Species whose **IUCN expert range lies entirely outside the US EEZ** are excluded. Their
    apparent presence in US waters was an edge-of-range artifact of environmental-envelope
    prediction, with near-zero suitability, so the effect on scores is negligible even though the
    species count drops.

v7:
  scope: >
    **Validity is decoupled from Program Areas.** Earlier releases silently required a species to
    overlap a current Program Area to count as valid, which hid biodiversity outside the program
    cycle's footprint. Validity now means a taxonomically valid species with a modeled distribution
    anywhere in the study area, and Program-Area membership becomes a spatial query answered
    afterwards. The count rises sharply **without a single species being added**.
  methods: >
    Scores are recomputed over the full set, with negligible effect: 18 of 20 Program Areas are
    unchanged.

  zones: >
    Scores are reported on the **20 Program Areas**. A single subregion also carries a composite
    score, which is a by-product of the study-area rollup rather than a reporting unit.
v8:
  datasets: >
    The same eight contributing inputs. NOAA SEFSC and NCCOS **density** models are ingested and
    catalogued but deliberately **excluded from the merge**, because their units (individuals per
    km²) have no agreed mapping onto the 0–100 suitability scale — they are flagged
    `is_scored = FALSE` so no published count includes them.
  methods: >
    The expert range **constrains** AquaMaps rather than merely competing with it, and whether a
    taxon has a range is decided **globally** — so a species whose range lies wholly outside US
    waters contributes no US cells. Governing extinction risk is applied at merge time, to the
    range cells. A BirdLife↔WoRMS crosswalk de-duplicates seabirds that earlier releases split
    across two taxa. Species categories come from taxonomy rather than keyword matching, removing
    the catch-all `other` and surfacing `primary_producer`; birds are additionally culled to
    marine/coastal families with at least 5% of their global range over ocean.
  scope: >
    Ingest becomes **global and whole-range** — no land mask, no Program-Area gate — while scoring
    stays over US waters. A species map now shows the species rather than the analysis extent.
    Non-turtle reptiles and amphibians remain excluded from scoring.
  technology: >
    Releases are published as **partitioned Parquet on S3** with a STAC catalog and a searchable
    STAC API, readable directly by DuckDB including in a browser. Score surfaces become
    **pre-rendered COGs**, retiring the tile factory that ran SQL per request. A stable `mdl_key`
    replaces the auto-increment `mdl_seq`, which renumbered on every rebuild and broke saved links.
    One application renders **every** release from a `?ver=` parameter, so the per-version forks
    are retired.
  zones: >
    Scores are reported on the **20 Program Areas**, and ecoregion and subregion rollups are
    restored alongside them — so the release covers every spatial unit it defines, rather than
    Program Areas alone.
v9:
  datasets: >
    **AquaX** (`ax`) joins as a ninth contributing input — an enhanced and revised AquaMaps
    framework (Reygondeau et al. 2026): 10,536 ensemble habitat-suitability models delivered on
    the analysis grid itself and **masked to US waters**. For the same species it **supersedes
    AquaMaps wherever AquaX was modeled** (10,517 species, 10,703 AquaMaps models); AquaMaps
    continues for the ~6,000 species AquaX did not model and everywhere outside AquaX's mask. A further 2,742
    species AquaX modeled but found absent in US waters keep their AquaMaps surface in this
    pre-release, pending review.
  methods: >
    Extinction risk becomes **spatial for species listed by Distinct Population Segment**: 18
    species whose ESA listing applies to some populations only (humpback and Southern Resident
    killer whales, Cook Inlet beluga, the salmonid ESUs, both sturgeons, …) take each listed
    entity's status inside its designated critical habitat, from NOAA Fisheries' authoritative
    service, and the IUCN category (plus the MMPA floor) across the rest of their range — then
    merge like the sea turtles, risk × suitability. Before this the humpback carried the Endangered
    status of DPSs that breed outside US waters everywhere it occurs, a flat maximum across its
    entire range. Supersession is a filter on the merge input, not a per-cell blend: inside the AquaX mask a
    superseded species' AquaMaps cells are dropped before the merge, so an AquaX absence is an
    absence. Values are AquaX's 0–1000 ensemble mean ÷ 10, on AquaMaps' 0–100 scale; the model's
    TSS cutoff is recorded but not applied. Every other rule — range constraint, governing
    extinction risk, turtle multiplication — is unchanged, and a control run with supersession
    switched off reproduces v8's Program-Area scores exactly.
  scope: >
    Scoring extent and species definition are unchanged from v8; what changes is **which model
    supplies suitability** for two thirds of the scored species inside US waters.
  technology: >
    A same-grid version bump now reuses the previous release's unchanged ingests (copy-on-write
    clone, verified against their content checkpoints) instead of re-running them, and every
    reader of the previous release resolves its schema by introspection.
