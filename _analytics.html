<!-- Google tag (gtag.js) — GA4 property 413466008 -->
<!--
  ONE measurement ID across every MarineSensitivity product (see the homepage
  repo's _analytics.html for why). Products are separated in reporting by
  `content_group`; this book reports as 'docs'.

  This replaces the `google-analytics:` key, which cannot set content_group and
  would double-count page views if both were enabled.
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9HW6L751XG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-9HW6L751XG', { content_group: 'docs' });

  // Quarto's `downloads: [pdf, docx]` buttons are plain anchors — the gtag
  // config above counts the page view but not the download, so track them
  // explicitly. Delegated so it survives Quarto's client-side navigation.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var m = href.match(/\.(pdf|docx|epub|csv|zip|gpkg|tif|parquet)(\?|$)/i);
    if (!m) return;
    gtag('event', 'file_download', {
      content_group: 'docs',
      file_extension: m[1].toLowerCase(),
      file_name: href.split('/').pop().slice(0, 100),
      link_text: (a.textContent || '').trim().slice(0, 100)
    });
  }, true);
</script>
