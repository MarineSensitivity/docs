on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

# One BOOK per MST release. The book source is parameterized by DOCS_VER
# (libs/versioned.R), so a single render produces the documentation for exactly
# one release, reading its numbers from that release's own published tables.
#
# Before this, one build mixed FOUR versions -- VERSION said v8, the maps drew v4
# geometry, db.qmd reported v6 row counts and the statistics came from an
# unversioned API with a hardcoded v7 fallback. Rebuilding a v4 doc set printed v8
# numbers under a v4 label, which is worse than a stale figure because it reads as
# authoritative.

jobs:
  # Which releases exist is DATA, not a list maintained here: the same
  # versions.json the apps and the pipeline read. Publishing v9 means publishing a
  # release, not editing this file.
  #
  # `access` (public | restricted) decides WHERE a book is published. GitHub Pages
  # cannot be gated, so a restricted release -- a pre-release under review by SDM
  # data providers and BOEM/NOAA colleagues -- goes to the `gh-pages-preview`
  # branch, which the server clones and serves only through the signed-in
  # preview.marinesensitivity.org host. A registry that predates the field is
  # read the way msens::atlas_versions() reads it: prerelease -> restricted
  # (fail closed: an old registry can hide a release, never leak one).
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      public: ${{ steps.set.outputs.public }}
      restricted: ${{ steps.set.outputs.restricted }}
    steps:
      - name: Resolve the published versions
        id: set
        run: |
          set -euo pipefail
          URL=https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/marine-atlas/versions.json
          curl -sf --max-time 60 "$URL" -o versions.json
          # assert the PAYLOAD parses, never just curl's exit status: S3 answers a
          # wrong-region request with a 301 whose body is 448 bytes of error XML,
          # and `curl -sf` calls that success.
          jq -e '.versions | length > 0' versions.json > /dev/null
          M=$(jq -c '[.versions[].ver]' versions.json)
          ACC='.versions | map(. + {access: (.access // (if .status == "prerelease" then "restricted" else "public" end))})'
          P=$(jq -c "$ACC | map(select(.access == \"public\") | .ver)" versions.json)
          R=$(jq -c "$ACC | map(select(.access == \"restricted\") | .ver)" versions.json)
          # every access value must be one of the two, or the split above silently drops a book
          jq -e "$ACC | all(.access == \"public\" or .access == \"restricted\")" versions.json > /dev/null
          echo "versions: $M  public: $P  restricted: $R"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "public=$P" >> "$GITHUB_OUTPUT"
          echo "restricted=$R" >> "$GITHUB_OUTPUT"

  # RENDER ONLY — no job here touches gh-pages.
  #
  # These jobs used to publish directly, and two of them finishing together lost a
  # race on the branch ref:
  #   ! [remote rejected] gh-pages (cannot lock ref: is at 4cefcb8 but expected 717e68e)
  # v4 rendered and verified perfectly and was thrown away at the push. `max-parallel`
  # does not help — it GUARANTEES concurrent pushes. So the render fans out and a
  # single downstream job makes exactly one commit.
  build:
    needs: versions
    runs-on: macOS-latest
    strategy:
      fail-fast: false      # one release failing must not withhold the other eight
      matrix:
        ver: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install librsvg (svg for pdf)
        run: brew install librsvg

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTex (pdf)
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install headless chromium (mmd -> img)
        run: quarto install chromium

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2

      - name: Render ${{ matrix.ver }}
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_CHROMIUM_HEADLESS_MODE: new
          DOCS_VER: ${{ matrix.ver }}

      # Assert the build actually IS the version it claims, before publishing it.
      # A DOCS_VER that failed to reach the render would silently publish the
      # VERSION-file default into ${{ matrix.ver }}/ -- the exact cross-version
      # bleed this whole design exists to prevent.
      - name: Verify the build documents ${{ matrix.ver }}
        run: |
          set -euo pipefail
          grep -q "documents release" _book/intro.html || {
            echo "intro.html does not carry the release sentence" >&2; exit 1; }
          grep -q ">${{ matrix.ver }}</strong>" _book/intro.html \
            || grep -q "documents release .*${{ matrix.ver }}" _book/intro.html \
            || { echo "intro.html does not name ${{ matrix.ver }}" >&2; exit 1; }

      - name: Upload the ${{ matrix.ver }} book
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.ver }}
          path: _book
          retention-days: 1

  # THE ONLY JOB THAT WRITES gh-pages, and it writes once: every PUBLIC version
  # that rendered, plus the root redirect, in a single commit. `if: always()` so a
  # version that failed to render does not withhold the ones that succeeded.
  # Restricted versions are never staged here, and any directory of theirs left
  # from when they were public is REMOVED -- that removal is what takes a release
  # under review off the public web.
  publish:
    needs: [versions, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download every rendered book
        uses: actions/download-artifact@v4
        with:
          pattern: book-*
          path: _dl

      - name: Publish the public versions, point / at the promoted release, prune the flat root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC: ${{ needs.versions.outputs.public }}
          RESTRICTED: ${{ needs.versions.outputs.restricted }}
        run: |
          set -euo pipefail
          is_in() { echo "$2" | jq -e --arg v "$1" 'index($v) != null' > /dev/null; }

          # Each artifact replaces its version directory WHOLESALE, so a page
          # deleted from the book stops being served instead of lingering.
          shopt -s nullglob
          for d in _dl/book-*; do
            v="${d#_dl/book-}"
            echo "$v" | grep -Eq '^v[0-9]+[a-z]?$' || { echo "skipping odd artifact $d" >&2; continue; }
            if ! is_in "$v" "$PUBLIC"; then echo "  $v is not public: not staged on gh-pages"; continue; fi
            [ -f "$d/index.html" ] || { echo "artifact $d has no index.html" >&2; exit 1; }
            rm -rf "./$v"
            mv "$d" "./$v"
            echo "  staged $v"
          done
          rm -rf _dl

          # a version that became RESTRICTED leaves the public site now
          for v in $(echo "$RESTRICTED" | jq -r '.[]'); do
            if [ -d "./$v" ]; then
              echo "  removing $v (restricted; served only on the preview host)"
              git rm -rq --ignore-unmatch -- "$v" || true
              rm -rf -- "./$v"
            fi
          done

          # / redirects to the version named by the atlas registry's latest.txt --
          # the SAME pointer the apps resolve, so docs and data cannot disagree
          # about which release is current.
          LATEST=$(curl -sf --max-time 60 \
            https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/marine-atlas/latest.txt \
            | tr -d '[:space:]')
          # payload check, not exit-status check (see the versions job)
          echo "$LATEST" | grep -Eq '^v[0-9]+[a-z]?$' \
            || { echo "latest.txt did not return a version: '$LATEST'" >&2; exit 1; }

          # latest.txt names the promoted DATA release, which may not have docs
          # built. Fall back to the newest version directory that does exist,
          # rather than redirecting at a 404.
          if [ ! -d "$LATEST" ]; then
            echo "no docs published for $LATEST; falling back"
            LATEST=$(ls -d v*/ 2>/dev/null | tr -d '/' | sort -V | tail -1)
            [ -n "$LATEST" ] || { echo "no version directories at all" >&2; exit 1; }
          fi
          echo "root redirect target: $LATEST"

          # Prune the flat, unversioned build: 486 files frozen at a single point
          # in time, still crawlable, and describing a version they never named.
          # Two competing copies in search results is worse than a 404.
          #
          # Deletes only TOP-LEVEL entries that are neither a version directory
          # nor part of the root itself. Version directories are matched on the
          # registry's own grammar, so a new release is never mistaken for cruft.
          KEEP='^(index\.html|404\.html|robots\.txt|\.nojekyll|\.git|CNAME|v[0-9]+[a-z]?)$'
          PRUNED=0
          for f in $(ls -A); do
            if ! echo "$f" | grep -Eq "$KEEP"; then
              echo "  pruning $f"
              # git rm alone leaves an UNTRACKED path on disk, which `git add -A`
              # would then re-add — so remove it from the worktree too
              git rm -rq --ignore-unmatch -- "$f" || true
              rm -rf -- "$f"
              PRUNED=$((PRUNED+1))
            fi
          done
          echo "pruned $PRUNED top-level entries"

          cat > index.html <<HTML
          <!doctype html><meta charset="utf-8">
          <title>Marine Sensitivity documentation</title>
          <link rel="canonical" href="./$LATEST/">
          <meta http-equiv="refresh" content="0; url=./$LATEST/">
          <p>Redirecting to the current documentation (<a href="./$LATEST/">$LATEST</a>)&hellip;</p>
          HTML
          # Unversioned deep links (/docs/scoring.html, the form every pre-2026-08
          # citation used) 404 on GitHub Pages now that the flat root is pruned.
          # Pages serves 404.html for every miss, so it forwards them to the
          # promoted release, keeping the page path, query and #anchor. A missing
          # VERSIONED path is different: it is usually a restricted pre-release,
          # which lives only on the review host, so say so and link there.
          cat > 404.html <<HTML
          <!doctype html><meta charset="utf-8">
          <title>Marine Sensitivity documentation</title>
          <meta name="robots" content="noindex">
          <p id="msg">Redirecting to the current documentation (<a href="/docs/$LATEST/">$LATEST</a>)&hellip;</p>
          <script>
          (function () {
            var latest = "$LATEST";
            var m = location.pathname.match(/^\/docs\/(?:(v[0-9]+[a-z]?)\/)?(.*)$/);
            if (!m) return;
            var ver = m[1], rest = m[2] || "";
            if (!ver) { location.replace("/docs/" + latest + "/" + rest + location.search + location.hash); return; }
            var p = document.getElementById("msg");
            p.textContent = "No public documentation at this address. Release " + ver + " may be a restricted pre-release, served only on the review host: ";
            var a = document.createElement("a");
            a.href = "https://preview.marinesensitivity.org/docs/" + ver + "/" + rest + location.search + location.hash;
            a.textContent = a.href; p.appendChild(a);
            p.appendChild(document.createTextNode(" — or open the current public documentation: "));
            var b = document.createElement("a"); b.href = "/docs/" + latest + "/"; b.textContent = latest; p.appendChild(b);
          })();
          </script>
          HTML
          printf 'User-agent: *\nAllow: /\n' > robots.txt

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already current"
          else
            git commit -m "docs: publish $(ls -d v*/ 2>/dev/null | tr -d '/' | tr '\n' ' ')- root -> $LATEST, $PRUNED pruned"
            git push
          fi

  # THE ONLY JOB THAT WRITES gh-pages-preview: the books of RESTRICTED versions,
  # each replaced wholesale, plus a root index and a robots.txt that refuses
  # crawlers. The branch is (re)written even when nothing is restricted, so the
  # server's docs-preview sidecar always has something to clone. Different branch
  # from `publish`, so the two pushes cannot race.
  publish-preview:
    needs: [versions, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out (main, then switch to gh-pages-preview or create it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every rendered book
        uses: actions/download-artifact@v4
        with:
          pattern: book-*
          path: _dl

      - name: Publish the restricted versions to gh-pages-preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESTRICTED: ${{ needs.versions.outputs.restricted }}
        run: |
          set -euo pipefail
          is_in() { echo "$2" | jq -e --arg v "$1" 'index($v) != null' > /dev/null; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # the downloaded books must survive the branch switch: park them outside the tree
          mv _dl /tmp/_dl
          if git ls-remote --exit-code --heads origin gh-pages-preview > /dev/null; then
            git fetch origin gh-pages-preview
            git checkout gh-pages-preview
          else
            git checkout --orphan gh-pages-preview
            git rm -rfq . || true
            git clean -fdxq
          fi

          shopt -s nullglob
          staged=""
          for d in /tmp/_dl/book-*; do
            v="${d#/tmp/_dl/book-}"
            echo "$v" | grep -Eq '^v[0-9]+[a-z]?$' || continue
            is_in "$v" "$RESTRICTED" || continue
            [ -f "$d/index.html" ] || { echo "artifact $d has no index.html" >&2; exit 1; }
            rm -rf "./$v"
            mv "$d" "./$v"
            staged="$staged $v"
            echo "  staged $v (restricted)"
          done
          # a version that is no longer restricted leaves this branch (it is public now)
          for d in v*/; do
            v="${d%/}"
            is_in "$v" "$RESTRICTED" || { echo "  removing $v (no longer restricted)"; git rm -rq --ignore-unmatch -- "$v" || true; rm -rf -- "./$v"; }
          done

          # root index: what is here, for a reviewer who lands on /docs/
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">'
            echo '<title>Marine Sensitivity documentation — preview (restricted releases)</title>'
            echo '<h1>Marine Sensitivity documentation — preview</h1>'
            echo '<p>Restricted, pre-release documentation for reviewers. Public releases: <a href="https://marinesensitivity.org/docs/">marinesensitivity.org/docs</a>.</p><ul>'
            for d in v*/; do v="${d%/}"; echo "<li><a href=\"./$v/\">$v</a></li>"; done
            echo '</ul>'
          } > index.html
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages-preview already current (restricted:${staged:- none})"
          else
            git commit -m "docs(preview): publish restricted${staged:- (none)}"
            git push origin gh-pages-preview
          fi

