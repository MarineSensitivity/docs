<!--
  Documentation version switcher.

  One book documented eight model releases, so a reader could not tell which
  version a page described, and a citation to the v4 methods had nowhere to
  point. Docs are now published per release under /{ver}/, and this widget moves
  between them.

  It reads the SAME versions.json that drives the pipeline and the apps, so the
  three cannot disagree about what exists. The bucket serves it with
  `Access-Control-Allow-Origin: *`, so the fetch works from the browser.

  The page's own version comes from its URL, not from a build-time injection:
  the published layout is /{ver}/..., so the path is the source of truth and
  cannot drift from where the file actually sits. If anything fails — offline,
  registry unreachable, an unversioned preview render — the widget simply does
  not appear, because a docs page must never fail to render over its own chrome.
-->
<script>
(function () {
  var REGISTRY = "https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/marine-atlas/versions.json";

  function parsePath() {
    var m = location.pathname.match(/^(.*?\/)(v\d+[a-z]?)(\/.*)?$/);
    if (!m) return null;
    return { prefix: m[1], ver: m[2], rest: m[3] || "/" };
  }

  function label(v) {
    var s = v.ver;
    if (v.status === "prerelease") s += " (pre-release)";
    else if (v.status === "retired") s += " (retired)";
    return v.title ? s + " — " + v.title : s;
  }

  // The script is injected into <head>, so on a fast/cached load the fetch can
  // resolve BEFORE the body exists -- and mounting into a null host silently
  // does nothing. Observed exactly that: the switcher appeared on the index but
  // not on an inner page whose registry response came from cache.
  function whenReady(fn) {
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", fn, { once: true });
    else fn();
  }

  function mount(el) {
    // the book sidebar is the natural home; fall back to the footer, then body
    var host = document.querySelector("#quarto-margin-sidebar")
            || document.querySelector("#quarto-sidebar")
            || document.querySelector(".nav-footer")
            || document.body;
    host.insertBefore(el, host.firstChild);
  }

  var here = parsePath();
  if (!here) return;   // unversioned (local preview) — nothing to switch between

  fetch(REGISTRY, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      var versions = (j && j.versions) || j;
      if (!versions || !versions.length) return;

      versions = versions.slice().sort(function (a, b) {
        return String(b.released || b.ver).localeCompare(String(a.released || a.ver));
      });

      var wrap = document.createElement("div");
      wrap.className = "docs-version-switcher";
      wrap.style.cssText = "margin:0.75rem 0;font-size:0.85rem;";

      var lab = document.createElement("label");
      lab.textContent = "Docs version";
      lab.style.cssText = "display:block;font-weight:600;margin-bottom:0.25rem;";
      lab.setAttribute("for", "docs-version-select");

      var sel = document.createElement("select");
      sel.id = "docs-version-select";
      sel.className = "form-select form-select-sm";

      versions.forEach(function (v) {
        var o = document.createElement("option");
        o.value = v.ver;
        o.textContent = label(v);
        if (v.ver === here.ver) o.selected = true;
        sel.appendChild(o);
      });

      // A release exists in the registry long before its DOCS are built -- today
      // only v8 is published, so offering v1-v7 as live options would hand the
      // reader a 404. Probe each one and mark the unbuilt ones, rather than
      // maintaining a second list that would drift from what is actually there.
      versions.forEach(function (v) {
        if (v.ver === here.ver) return;
        fetch(here.prefix + v.ver + "/", { method: "HEAD" })
          .then(function (r) {
            if (r.ok) return;
            var o = sel.querySelector("option[value='" + v.ver + "']");
            if (o) { o.disabled = true; o.textContent = label(v) + " — docs not published"; }
          })
          .catch(function () {
            var o = sel.querySelector("option[value='" + v.ver + "']");
            if (o) { o.disabled = true; o.textContent = label(v) + " — docs not published"; }
          });
      });

      sel.addEventListener("change", function () {
        // keep the reader on the SAME page in the other version; if that page
        // did not exist then, the server 404s and they can climb to its index —
        // better than always dumping them at the top of an unfamiliar book
        location.href = here.prefix + sel.value + here.rest;
      });

      wrap.appendChild(lab);
      wrap.appendChild(sel);
      whenReady(function () { mount(wrap); });
    })
    .catch(function () { /* registry unreachable: show nothing */ });
})();
</script>
