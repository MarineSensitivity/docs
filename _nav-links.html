<!--
  Core links, on every page (docs#6).

  The app links DO exist — on the Preface, under "Interactive Apps", which is
  where marinesensitivity.org/docs/ lands. But a Quarto book keeps them on that
  one page: follow a search hit, a bookmark or a chapter link and the sidebar
  shows only chapters, so the viewer is no longer reachable from anywhere on
  screen. Tim White found it in §13 Server — a page that happens to list service
  URLs — which is the failure, not the destination:

    "after misplacing the link on my desktop, it took me quite some time to
     locate it in the documentation ... could we create a box on the
     Introduction page, or possibly across all pages"

  There was no GitHub link on any page either: `repo-url` is set, but
  `repo-actions: [edit]` renders only a small "Edit this page" action in the
  right-hand TOC, which is not what someone looking for the source is scanning
  for.

  WHY CLIENT-SIDE, and why here. This mirrors _version-switcher.html deliberately
  — same include-in-header mechanism, same sidebar host, so the two read as one
  control strip and neither needs a Quarto feature that books do not have. It
  also means the version comes from the page's own URL (/{ver}/...), which cannot
  drift from where the file actually sits, rather than from a build-time
  injection.

  This DUPLICATES msens::product_urls() in JavaScript, which is a real cost worth
  naming: the R side is the authority and is unit-tested, but a static book has
  no R at read time. Kept deliberately identical in shape — ?ver= for a public
  release, the preview host's PATH form for a restricted one — and the same
  fail-closed access default the switcher and msens::atlas_versions() use
  (prerelease -> restricted). If one changes, change both.

  If anything fails — offline, registry unreachable, an unversioned local preview
  — the box simply does not appear. A docs page must never fail to render over
  its own chrome.
-->
<script>
(function () {
  var REGISTRY = "https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/marine-atlas/versions.json";
  var APP      = "https://app.marinesensitivity.org";
  var PREVIEW  = "https://preview.marinesensitivity.org";
  var HOME     = "https://marinesensitivity.org";
  var GITHUB   = "https://github.com/MarineSensitivity";
  var REPO     = "https://github.com/MarineSensitivity/docs";

  function access(v) { return v.access || (v.status === "prerelease" ? "restricted" : "public"); }

  // Same rule as msens::product_urls(): the version is a QUERY parameter on the
  // public host and a PATH segment on the signed-in preview host, because
  // Cloudflare Access scopes its per-version reviewer policies by path.
  function appUrls(ver, acc) {
    if (acc === "restricted")
      return { scores: PREVIEW + "/" + ver + "/scores/",
               species: PREVIEW + "/" + ver + "/species/" };
    return { scores: APP + "/scores/?ver=" + ver,
             species: APP + "/species/?ver=" + ver };
  }

  function parseVer() {
    var m = location.pathname.match(/^(.*?\/)(v\d+[a-z]?)(\/.*)?$/);
    return m ? m[2] : null;
  }

  // The script is injected into <head>, so on a fast/cached load it can run
  // before the body exists — mounting into a null host silently does nothing.
  function whenReady(fn) {
    if (document.readyState === "loading")
      document.addEventListener("DOMContentLoaded", fn, { once: true });
    else fn();
  }

  // Both this and the version switcher mount at host.firstChild once their own
  // fetch resolves, so whichever lands LAST ends up on top and the pair's order
  // flips between page loads (observed live: core-links first locally, switcher
  // first on marinesensitivity.org). Each now anchors on the other instead, so
  // the strip reads the same way whichever wins the race: links, then switcher.
  function mount(el) {
    var host = document.querySelector("#quarto-margin-sidebar")
            || document.querySelector("#quarto-sidebar")
            || document.querySelector(".nav-footer")
            || document.body;
    // if the switcher already mounted, go directly above it; else take the top
    var sw = host.querySelector(".docs-version-switcher");
    host.insertBefore(el, sw || host.firstChild);
  }

  function link(href, text, title) {
    var a = document.createElement("a");
    a.href = href; a.textContent = text;
    if (title) a.title = title;
    a.style.cssText = "display:block;padding:0.1rem 0;";
    return a;
  }

  function box(ver, acc) {
    var u = appUrls(ver, acc);
    var wrap = document.createElement("div");
    wrap.className = "docs-core-links";
    wrap.style.cssText =
      "margin:0.75rem 0;padding:0.6rem 0.75rem;font-size:0.85rem;" +
      "border:1px solid rgba(128,128,128,0.35);border-radius:0.35rem;";

    var h = document.createElement("div");
    h.textContent = "Core links";
    h.style.cssText = "font-weight:600;margin-bottom:0.35rem;";
    wrap.appendChild(h);

    // The apps are what Tim could not find, so they lead — and they point at
    // THIS book's release, never the promoted one, so the reader is not moved
    // to a different version than the page they are reading.
    wrap.appendChild(link(u.scores,  "▶ Composite Scores",
                          "sensitivity scores by zone (" + ver + ")"));
    wrap.appendChild(link(u.species, "▶ Species Distribution",
                          "individual species models (" + ver + ")"));

    var hr = document.createElement("div");
    hr.style.cssText = "border-top:1px solid rgba(128,128,128,0.25);margin:0.4rem 0;";
    wrap.appendChild(hr);

    wrap.appendChild(link(HOME,   "⌂ Project home", "marinesensitivity.org"));
    wrap.appendChild(link(GITHUB, "◇ GitHub — all repositories", GITHUB));
    wrap.appendChild(link(REPO,   "◇ GitHub — these docs", REPO));
    return wrap;
  }

  var ver = parseVer();
  if (!ver) return;   // unversioned local preview: nothing reliable to link to

  fetch(REGISTRY, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      var versions = (j && j.versions) || j;
      if (!versions || !versions.length) return;
      var me = versions.filter(function (v) { return v.ver === ver; })[0];
      // A book can be published for a release the registry has not caught up
      // with; fail CLOSED so a restricted pre-release is never linked at the
      // public host, where it would 404 or leak that it exists.
      var acc = me ? access(me) : "restricted";
      whenReady(function () { mount(box(ver, acc)); });
    })
    .catch(function () { /* registry unreachable: show nothing */ });
})();
</script>
